name: Publish to npm
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/seculens
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev
      # Authenticates through npm trusted publishing (OIDC). An empty NODE_AUTH_TOKEN would block it.
      - run: npm publish --provenance --access public
